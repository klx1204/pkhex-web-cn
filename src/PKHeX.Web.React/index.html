<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <meta name="description"
          content="PKHeX Web 中文版：在浏览器里编辑宝可梦存档，支持从红绿到朱紫以及多款改版。存档只在本地解析，不上传，不修改服务器数据。"/>
    <meta name="keywords" content="PKHeX, 宝可梦, 存档编辑器, 中文版, 浏览器, Pokémon, save editor"/>
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="PKHeX Web 中文版"/>
    <meta property="og:description"
          content="在浏览器里编辑宝可梦存档。存档只在本地解析，不上传。"/>
    <meta name="og:type" content="website"/>
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" content="PKHeX Web 中文版"/>
    <meta name="twitter:description" content="在浏览器里编辑宝可梦存档。存档只在本地解析，不上传。"/>
    <meta name="theme-color" content="#0b7a72"/>

    <title>PKHeX Web 中文版</title>

    <!-- A GitHub Pages project site needs the repository name in every absolute URL. -->
    <base href="%BASE_URL%"/>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg"/>

    <!-- Restores the URL 404.html saved, before the router reads it. -->
    <script>
        (function () {
            var redirect = sessionStorage.redirect;
            delete sessionStorage.redirect;
            if (redirect && redirect != location.href) {
                history.replaceState(null, null, redirect);
            }
        })();
    </script>
</head>

<body>
    <div id="root">
        <div class="loading-text">正在加载…</div>
        <h1 class="loading-text">PKHeX Web 中文版 - 浏览器里的宝可梦存档编辑器</h1>
    </div>

    <script type="module" src="/src/index.ts"></script>
</body>

</html>
